name: Daily News to LINE

on:
  schedule:
    # UTC 22:00 = JST 7:00(翌日)
    - cron: "0 22 * * *"
  # 手動実行してテストしたいときのためのボタン
  workflow_dispatch:

permissions:
  contents: write   # 生成した詳細ページ(docs/)をコミットするため
  pages: write      # GitHub Pagesへ公開するため
  id-token: write   # GitHub Pagesへ公開するため

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests trafilatura

      # 1) ニュースを集めて、日本語の詳細ページ(docs/)を作る
      - name: Build news pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python news_bot.py build

      # 2) 過去分も残るように、生成したページをリポジトリに保存する
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Add news pages $(date -u +%F)"
            git push
          fi

      # 3) ページを公開する(LINEより先に公開して、リンク切れを防ぐ)
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 4) 公開が終わってからLINEに送る
      - name: Send to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python news_bot.py send

      - name: Notify error to LINE
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python news_bot.py error
